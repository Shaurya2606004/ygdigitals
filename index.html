<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>YG Digitals — Social Media, E-commerce, Packaging, Websites & Video | Gohana, Pan-India</title>
    <meta name="description" content="YG Digitals is a Gohana-based digital studio for social media management, Amazon/Flipkart/Meesho e-commerce handling, packaging design, website design, video editing and video ad &amp; Reel shoots — serving brands across India." />
    <meta name="theme-color" content="#0d0d0d" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://ygdigitals.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ygdigitals.com/" />
    <meta property="og:title" content="YG Digitals — Stop the scroll." />
    <meta property="og:description" content="Ads, marketplaces, packaging, websites & video that make people stop, look — and buy. Book a free call." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- the loader's two fonts start downloading alongside the JS instead of after it -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/unbounded/files/unbounded-latin-900-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/unbounded/files/unbounded-latin-800-normal.woff2" />
    <!-- baked lighting for the 3D scenes; the hero's shaders compile only once it's in -->
    <link rel="preload" as="image" crossorigin href="/src/three/studio-env.png" />
    <style>
      html, body { background: #0d0d0d; margin: 0; }
      /* the loader's clay blob, painted before any JS arrives; React's loader takes over from this exact frame */
      .boot { position: fixed; inset: 0; display: grid; place-items: center; }
      .boot > div { width: 150px; height: 150px; background: #e04c5c; border-radius: 42% 58% 55% 45% / 50% 45% 55% 50%; box-shadow: inset -14px -18px 0 rgba(0, 0, 0, 0.12), inset 12px 14px 0 rgba(255, 255, 255, 0.2); animation: boot 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
      @keyframes boot { from { transform: scale(0); } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" aria-hidden="true"><div></div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
